name: Release

# Tag the commit as v<version> matching package.json, e.g. v0.2.0.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$TAG" ] || { echo "::error::package.json is $VERSION but tag is $TAG"; exit 1; }

      - run: npm run lint
      - run: npm run build

      # Catches the class of bug where dist builds fine but the exports map
      # makes it unreachable to consumers.
      - name: Smoke test packed tarball
        run: |
          TARBALL=$(npm pack --pack-destination /tmp | tail -1)
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i "/tmp/$TARBALL"
          node --input-type=module -e "
            import { FoPost } from '@fopost/sdk';
            if (!new FoPost({ apiKey: 'x' }).posts) throw new Error('ESM export broken');
            console.log('ESM ok');
          "
          node --input-type=commonjs -e "
            const { FoPost } = require('@fopost/sdk');
            if (!new FoPost({ apiKey: 'x' }).posts) throw new Error('CJS export broken');
            console.log('CJS ok');
          "

      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@fopost/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@fopost/sdk@$VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi
